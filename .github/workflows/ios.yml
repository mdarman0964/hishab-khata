name: Build iOS App

on:
  push:
    branches: [ios-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create and sync Capacitor iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive iOS device app (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/hishab-khata.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: hishab-khata-ios-simulator
          path: build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error

      - name: Upload unsigned iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: hishab-khata-ios-archive
          path: build/hishab-khata.xcarchive
          if-no-files-found: error
