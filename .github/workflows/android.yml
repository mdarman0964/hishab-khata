name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Inject Firebase config from GitHub Secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::GitHub Actions secret API_KEY is missing."
            exit 1
          fi
          cat > www/firebase-config.js <<EOF
          // Generated during the Android build from GitHub Actions secret API_KEY.
          window.FIREBASE_CONFIG = { apiKey: "$API_KEY", projectId: "amar-khata-b5d2d" };
          EOF

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hishab-khata.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hishab-khata-apk
          path: hishab-khata.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: সর্বশেষ APK
          body: প্রতিবার কোড আপলোড করলে এই APK নতুন করে তৈরি হয়। ডাউনলোড করে ফোনে ইনস্টল করুন।
          files: hishab-khata.apk
